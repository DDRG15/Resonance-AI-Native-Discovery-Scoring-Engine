# =============================================================================
# docker-compose.yml — Project GEMA
# Usage: docker compose up --build
# =============================================================================

services:
  gema:
    build: .
    ports:
      - "8501:8501"

    # Load API keys from your local .env file — never baked into the image
    env_file:
      - .env

    volumes:
      # Persist the SQLite registry across container restarts
      - ./gema_registry.db:/app/gema_registry.db
      # Mount credentials read-only — JSON key file never baked into the image
      - ./credentials:/app/credentials:ro
      # Mount session cookies for login-gated boards (wellfound, arc.dev, etc.)
      # Export cookies from Chrome using EditThisCookie V3 and drop JSON files here.
      # Files are gitignored — never baked into the image.
      - ./cookies:/app/cookies:ro
      # Mount user profile so matcher uses real CV data — gitignored, never baked in
      - ./user_profile.yaml:/app/user_profile.yaml:ro

    restart: unless-stopped
