[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
asyncio_mode = auto
minversion = 6.0
addopts = -q -ra
markers =
	integration: marks tests as integration tests (use with --integration)
	slow: marks tests as slow

[coverage:run]
branch = True
source = gema

[coverage:report]
fail_under = 80
show_missing = True
